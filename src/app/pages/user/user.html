
<app-search-input [(text)]="searchTerm"></app-search-input>

<hr>

<ul class="list-group">

    @for(user of filteredUsers(); track user.id){
    <li class="list-group-item d-flex gap-2" [routerLink]="'/users/' + user.id" >

        <img src="https://ui-avatars.com/api/?name={{ user.firstName }}+{{ user.lastName }}" class="rounded-pill">
        <div class="d-flex flex-column">
            <strong>{{ user.firstName }} {{ user.lastName }}</strong>
            <em> {{ user.email }} </em>
        </div>
    </li>
    }
</ul>
