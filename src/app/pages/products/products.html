<ul class="list-group">

    @for(product of productApi.products(); track product.id){
    <li class="list-group-item d-flex gap-2" routerLink="/products/{{ product.id }}">
        <img src="{{ product.thumbnail }}" class="rounded-pill">
        <div class="d-flex flex-column">
            <strong>{{ product.title }}</strong>
            <code>{{ product.price }}</code>
            <em> {{ product.description }} </em>
        </div>
    </li>
    }
</ul>
