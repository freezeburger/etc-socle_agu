<app-card-ui>

    <footer>
        <app-button level="danger" (click)="data().deleteProduct()"> Des chiffes & Delete </app-button>
    </footer>

    <main class="d-flex">
        <img src="{{data().product().thumbnail}}" class="card-image">
        <aside>
            <code>{{data().product().price}}</code>
            <p>{{data().product().description}}</p>
        </aside>
    </main>

    <header>
        <h3>{{data().product().title}}</h3>
    </header>

</app-card-ui>
