
@let notification = linkedNotification();

@if(notification){

    <div class="alert"[class]=" 'alert-' + notification.level || ''">
        <h2>{{ notification.title }}</h2>
        <p>{{ notification.message }}</p>
        <em>{{ notification.createdAt }}</em>
    </div>

}
@else {

    <p>No notifications available.</p>
    
}
